name: Diagnostic Compile Log

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4

      - name: Build and capture log
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace --no-daemon > compile-log.txt 2>&1
          code=$?
          tail -n 260 compile-log.txt
          exit $code

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: compile-log.txt
