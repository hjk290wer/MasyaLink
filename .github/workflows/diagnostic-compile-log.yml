name: Diagnostic Compile Log

on:
  push:
    branches:
      - ui/near-release-pink-messenger
  pull_request:
    branches:
      - main
      - master

jobs:
  compile-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Capture compile log
        shell: bash
        run: |
          set +e
          gradle :app:compileDebugKotlin --console=plain --stacktrace > compile-log.txt 2>&1
          status=$?
          tail -n 100 compile-log.txt
          exit $status

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: compile-log.txt
